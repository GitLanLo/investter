[project]
name = "invest-ml-core"
version = "0.1.0"
description = "Project-specific ML/data core for invest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.4.0",
  "pandas>=3.0.0",
  "pyarrow>=23.0.0",
  "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[project.scripts]
invest-ml = "ml_core.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
